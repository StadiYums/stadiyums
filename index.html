<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StadiYums Demo — Chukchansi Park</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.47.0/iconfont/tabler-icons.min.css">
<style>
  :root{
    --navy:#1B2A4A; --navy-deep:#101A30; --gold:#B8892E; --gold-bright:#D9A63E;
    --red:#8C1D1D; --cream:#F3EEE4; --turf:#33502F; --ink:#1F1B16;
    --line:rgba(31,27,22,0.1);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Inter',sans-serif; background:var(--cream); color:var(--ink); line-height:1.5;}
  h1,h2,h3{font-family:'Archivo Black',sans-serif; font-weight:400;}
  .mono{font-family:'Space Mono',monospace;}
  button{font-family:'Inter',sans-serif; cursor:pointer; border:none;}
  .wrap{max-width:880px; margin:0 auto; padding:0 20px;}

  header{background:var(--navy); color:var(--cream); padding:18px 0;}
  header .wrap{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand svg{width:26px; height:26px;}
  .brand-text{font-family:'Archivo Black'; font-size:17px;}
  .brand-text span{color:var(--gold-bright);}
  .venue-tag{font-family:'Space Mono'; font-size:12px; color:var(--gold-bright); border:1px solid rgba(217,166,62,0.4); border-radius:100px; padding:5px 12px;}

  .tabs{display:flex; gap:0; background:var(--navy-deep); border-radius:10px; padding:4px; margin:20px auto; max-width:340px;}
  .tab-btn{
    flex:1; padding:10px 14px; border-radius:7px; background:transparent; color:rgba(243,238,228,0.6);
    font-size:13.5px; font-weight:600; display:flex; align-items:center; justify-content:center; gap:7px;
    transition:background .15s ease, color .15s ease;
  }
  .tab-btn.active{background:var(--gold-bright); color:var(--navy-deep);}
  .tab-btn i{font-size:16px;}

  main{padding:8px 0 80px;}
  .card{background:#fff; border:1px solid var(--line); border-radius:14px; padding:22px;}
  .section-label{font-family:'Space Mono'; font-size:11.5px; letter-spacing:0.08em; text-transform:uppercase; color:var(--red); font-weight:700; margin-bottom:10px;}

  .seat-row{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:18px;}
  .field label{display:block; font-size:11.5px; font-family:'Space Mono'; color:#7a7263; margin-bottom:6px; text-transform:uppercase; letter-spacing:0.04em;}
  .field select{
    width:100%; padding:11px 10px; border-radius:8px; border:1.5px solid var(--line); background:var(--cream);
    font-family:'Space Mono'; font-size:14px; font-weight:700; color:var(--navy); appearance:none;
  }
  .seat-preview{
    display:flex; align-items:center; gap:10px; background:var(--navy); color:var(--cream);
    border-radius:10px; padding:14px 16px; margin-bottom:24px; font-family:'Space Mono'; font-size:14px;
  }
  .seat-preview i{color:var(--gold-bright); font-size:20px;}

  .stand-group{margin-bottom:28px;}
  .stand-name{font-size:12.5px; font-family:'Space Mono'; color:var(--turf); font-weight:700; margin-bottom:12px; display:flex; align-items:center; gap:6px;}
  .menu-item{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    padding:14px 0; border-top:1px solid var(--line);
  }
  .item-thumb{
    width:48px; height:48px; min-width:48px; border-radius:12px;
    background:linear-gradient(160deg, var(--cream), #e9e2d0);
    border:1px solid var(--line); display:flex; align-items:center; justify-content:center;
    font-size:24px; line-height:1;
  }
  .menu-item .info{flex:1; min-width:0;}
  .menu-item .info h3{font-size:15.5px; font-weight:600; font-family:'Inter'; margin-bottom:3px;}
  .menu-item .info p{font-size:12.5px; color:#7a7263;}
  .menu-item .price{font-family:'Space Mono'; font-size:14px; color:var(--navy); font-weight:700; min-width:56px; text-align:right;}
  .qty{display:flex; align-items:center; gap:10px;}
  .qty button{
    width:28px; height:28px; border-radius:50%; background:var(--cream); border:1.5px solid var(--line) !important;
    color:var(--navy); font-size:15px; font-weight:700; display:flex; align-items:center; justify-content:center;
  }
  .qty button:disabled{opacity:0.3; cursor:default;}
  .qty span{font-family:'Space Mono'; font-size:14px; min-width:16px; text-align:center; font-weight:700;}

  .cart-bar{
    position:fixed; bottom:0; left:0; right:0; background:var(--red); color:var(--cream);
    padding:16px 0; transform:translateY(110%); transition:transform .25s ease; z-index:40;
  }
  .cart-bar.show{transform:translateY(0);}
  .cart-bar .wrap{display:flex; align-items:center; justify-content:space-between;}
  .cart-bar .left{font-size:14px;}
  .cart-bar .left b{font-family:'Space Mono';}
  .cart-bar button{background:var(--cream); color:var(--red); padding:12px 22px; border-radius:8px; font-weight:700; font-size:14.5px;}

  .tracker-seat{display:flex; align-items:center; justify-content:space-between; margin-bottom:28px; flex-wrap:wrap; gap:12px;}
  .tracker-seat h2{font-size:24px; color:var(--navy);}
  .tracker-seat .order-id{font-family:'Space Mono'; font-size:12px; color:#7a7263;}
  .stepper{display:flex; margin-bottom:32px;}
  .stepper .step{flex:1; text-align:center; position:relative;}
  .stepper .step .dot{
    width:34px; height:34px; border-radius:50%; background:#e7e1d3; color:#a89f8c; display:flex; align-items:center;
    justify-content:center; margin:0 auto 10px; font-size:16px; position:relative; z-index:2;
    transition:background .3s ease, color .3s ease;
  }
  .stepper .step.done .dot{background:var(--turf); color:#fff;}
  .stepper .step.current .dot{background:var(--red); color:#fff; box-shadow:0 0 0 5px rgba(140,29,29,0.15);}
  .stepper .step .line{position:absolute; top:17px; left:-50%; width:100%; height:3px; background:#e7e1d3; z-index:1;}
  .stepper .step:first-child .line{display:none;}
  .stepper .step.done .line{background:var(--turf);}
  .stepper .step span.label{font-size:11px; font-family:'Space Mono'; color:#7a7263; font-weight:700; text-transform:uppercase; letter-spacing:0.03em;}
  .eta-banner{
    background:rgba(51,80,47,0.08); border:1px solid rgba(51,80,47,0.2); border-radius:10px;
    padding:16px 18px; display:flex; align-items:center; gap:12px; margin-bottom:24px;
  }
  .eta-banner i{font-size:22px; color:var(--turf);}
  .eta-banner b{font-family:'Space Mono'; color:var(--turf);}
  .order-list .row{display:flex; justify-content:space-between; padding:9px 0; border-top:1px solid var(--line); font-size:14px;}
  .order-list .row:last-child{border-bottom:1px solid var(--line); font-weight:700;}
  .again-btn{width:100%; margin-top:20px; background:var(--navy); color:var(--cream); padding:14px; border-radius:9px; font-weight:700;}

  .runner-stats{display:flex; gap:12px; margin-bottom:22px; flex-wrap:wrap;}
  .stat-chip{flex:1; min-width:130px; background:var(--navy); color:var(--cream); border-radius:10px; padding:14px 16px;}
  .stat-chip .n{font-family:'Space Mono'; font-size:22px; color:var(--gold-bright); font-weight:700;}
  .stat-chip .l{font-size:11px; color:rgba(243,238,228,0.65); text-transform:uppercase; letter-spacing:0.04em;}
  .queue-title{font-family:'Space Mono'; font-size:12px; text-transform:uppercase; letter-spacing:0.06em; color:#7a7263; margin:24px 0 12px; font-weight:700;}
  .order-card{
    background:#fff; border:1px solid var(--line); border-left:4px solid var(--gold); border-radius:10px;
    padding:16px 18px; margin-bottom:12px; display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
  }
  .order-card.preparing{border-left-color:var(--gold);}
  .order-card.on_the_way{border-left-color:var(--red);}
  .order-card.delivered{border-left-color:var(--turf); opacity:0.6;}
  .order-card .seat-block{font-family:'Space Mono'; font-weight:700; color:var(--navy); font-size:15px; min-width:150px;}
  .order-card .items-block{font-size:13px; color:#5a5348; flex:1; min-width:160px;}
  .order-card .meta{font-family:'Space Mono'; font-size:11.5px; color:#7a7263; min-width:96px; line-height:1.5;}
  .status-badge{
    font-family:'Space Mono'; font-size:11px; font-weight:700; text-transform:uppercase; padding:5px 10px;
    border-radius:100px; letter-spacing:0.03em;
  }
  .status-badge.placed{background:rgba(140,29,29,0.1); color:var(--red);}
  .status-badge.preparing{background:rgba(184,137,46,0.15); color:#8a6420;}
  .status-badge.on_the_way{background:rgba(140,29,29,0.12); color:var(--red);}
  .status-badge.delivered{background:rgba(51,80,47,0.12); color:var(--turf);}
  .advance-btn{background:var(--navy); color:var(--cream); padding:10px 16px; border-radius:8px; font-size:13px; font-weight:700; white-space:nowrap;}
  .advance-btn:disabled{background:#d8d2c4; color:#a89f8c; cursor:default;}
  .empty-note{color:#7a7263; font-size:13.5px; padding:20px 0; text-align:center;}

  .view{display:none;}
  .view.active{display:block;}
  @media (max-width:600px){
    .seat-row{grid-template-columns:1fr 1fr 1fr; gap:8px;}
    .order-card{flex-direction:column; align-items:flex-start;}
    .advance-btn{width:100%;}
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="brand">
      <svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="20" y="120" width="120" height="20" rx="4" fill="#F3EEE4"/>
        <rect x="40" y="90" width="80" height="20" rx="4" fill="#F3EEE4"/>
        <rect x="60" y="60" width="40" height="20" rx="4" fill="#F3EEE4"/>
        <line x1="62" y1="35" x2="78" y2="45" stroke="#D9A63E" stroke-width="4" stroke-linecap="round"/>
        <line x1="72" y1="28" x2="86" y2="40" stroke="#D9A63E" stroke-width="4" stroke-linecap="round"/>
        <circle cx="100" cy="42" r="12" fill="#8C1D1D"/>
      </svg>
      <div class="brand-text">Stadi<span>Yums</span></div>
    </div>
    <div class="venue-tag"><i class="ti ti-map-pin" aria-hidden="true"></i> Chukchansi Park · Fresno, CA — Demo</div>
  </div>
</header>

<div class="wrap">
  <div class="tabs">
    <button class="tab-btn active" id="tabFan" onclick="setTab('fan')"><i class="ti ti-device-mobile"></i>Fan app</button>
    <button class="tab-btn" id="tabRunner" onclick="setTab('runner')"><i class="ti ti-walk"></i>Runner app</button>
  </div>
</div>

<main class="wrap">
  <div class="view active" id="view-fan"></div>
  <div class="view" id="view-runner"></div>
</main>

<div class="cart-bar" id="cartBar">
  <div class="wrap">
    <div class="left"><b id="cartCount">0</b> items · <b id="cartTotal" class="mono">$0.00</b></div>
    <button onclick="placeOrder()">Place order →</button>
  </div>
</div>

<script>
const MENU = [
  {id:'dog', stand:'Downtown Dogs', name:'Grizzlies Dog', desc:'All-beef, grilled onions', price:6.5, emoji:'🌭'},
  {id:'brat', stand:'Downtown Dogs', name:'Andouille Sausage', desc:'Peppers & onions', price:8.0, emoji:'🌭'},
  {id:'tritip', stand:'San Joaquin BBQ Co.', name:'Tri-Tip Sandwich', desc:'Santa Maria style, Central Valley classic', price:11.0, emoji:'🥪'},
  {id:'nachos', stand:'San Joaquin BBQ Co.', name:'Loaded Nachos', desc:'Queso, jalapeno, pulled pork', price:9.5, emoji:'🧀'},
  {id:'fries', stand:'Tower Taco Stand', name:'Garlic Fries', desc:'Fresh cut, parm & garlic', price:7.0, emoji:'🍟'},
  {id:'taco', stand:'Tower Taco Stand', name:'Street Tacos (3)', desc:'Carne asada, salsa verde', price:10.0, emoji:'🌮'},
  {id:'kettle', stand:'Sierra Kettle Corn', name:'Kettle Corn', desc:'Sweet & salty, made fresh', price:6.0, emoji:'🍿'},
  {id:'dole', stand:'Sierra Kettle Corn', name:'Dole Whip', desc:'Pineapple soft serve', price:7.5, emoji:'🍍'},
  {id:'soda', stand:'Valley Fresh Drinks', name:'Fountain Soda', desc:'Free refill souvenir cup', price:5.5, emoji:'🥤'},
  {id:'lemonade', stand:'Valley Fresh Drinks', name:'Fresh Lemonade', desc:'Squeezed daily', price:6.5, emoji:'🍋'},
];

const SECTIONS = Array.from({length:30}, (_,i)=>101+i);
const ROWS = 'ABCDEFGHIJKLMN'.split('');
const SEATS = Array.from({length:20}, (_,i)=>i+1);

// Approximate concourse position of each stand, expressed as the section
// it sits nearest to. Chukchansi Park's concourse wraps in a loop behind
// sections 101-130, so we use that loop to model real walking distance.
const STAND_LOCATIONS = {
  'Valley Fresh Drinks': 103,   // near home plate / main gate
  'Downtown Dogs': 108,         // first base side
  'San Joaquin BBQ Co.': 116,   // right field concourse
  'Tower Taco Stand': 123,      // center/left field concourse
  'Sierra Kettle Corn': 129,    // third base side
};

const MIN_PER_SECTION = 0.35;  // walking minutes per section of concourse
const PREP_BASE_MIN = 2;       // minutes to fire the first item
const PREP_PER_STAND_MIN = 1;  // extra prep minutes for each additional stand in the order

const itemStandLookup = Object.fromEntries(MENU.map(m=>[m.id, m.stand]));
function itemStand(id){ return itemStandLookup[id]; }

// Circular distance between two sections, walking the concourse loop
// (shorter of clockwise vs. counter-clockwise), measured in "sections".
function sectionDistance(a, b){
  const n = SECTIONS.length;
  const ai = SECTIONS.indexOf(a);
  const bi = SECTIONS.indexOf(b);
  const diff = Math.abs(ai - bi);
  return Math.min(diff, n - diff);
}

// Estimates how long an order will take to reach a seat: prep time at the
// stand(s) involved, plus a runner's walk from those stands to the seat's
// section along the concourse loop.
function estimateDelivery(order){
  const stands = [...new Set(order.items.map(it=>itemStand(it.id)))];
  const anchors = stands.map(s=>STAND_LOCATIONS[s]).sort((a,b)=>a-b);
  let walk = 0;
  for(let i=1;i<anchors.length;i++){ walk += sectionDistance(anchors[i-1], anchors[i]); }
  walk += sectionDistance(anchors[anchors.length-1], order.section);
  const prep = PREP_BASE_MIN + (stands.length-1)*PREP_PER_STAND_MIN;
  const minutes = Math.max(3, Math.round(prep + walk*MIN_PER_SECTION));
  return {minutes, distance: walk, stands};
}

let cart = {};
let seat = {section:112, row:'F', seat:8};
let activeOrder = null;
let queue = [];
let completed = [];
let orderCounter = 1000;

const STEPS = [
  {key:'placed', label:'Ordered', icon:'ti-receipt'},
  {key:'preparing', label:'Preparing', icon:'ti-soup'},
  {key:'on_the_way', label:'On the way', icon:'ti-walk'},
  {key:'delivered', label:'Delivered', icon:'ti-check'},
];

function seedQueue(){
  const now = Date.now();
  const seed1 = {id: orderCounter++, section:104, row:'C', seat:14, items:[{id:'tritip',qty:1},{id:'soda',qty:1}], status:'placed', placedAt: now - 40*1000};
  const seed2 = {id: orderCounter++, section:121, row:'H', seat:3, items:[{id:'nachos',qty:1},{id:'kettle',qty:1},{id:'lemonade',qty:2}], status:'preparing', placedAt: now - 3*60*1000};
  [seed1, seed2].forEach(o=>{ const est = estimateDelivery(o); o.etaMinutes = est.minutes; o.etaDistance = est.distance; });
  queue.push(seed1, seed2);
}
seedQueue();

function money(n){ return '$' + n.toFixed(2); }
function itemName(id){ return MENU.find(m=>m.id===id).name; }
function itemPrice(id){ return MENU.find(m=>m.id===id).price; }
function itemEmoji(id){ return MENU.find(m=>m.id===id).emoji; }
function cartTotal(){ return Object.entries(cart).reduce((sum,[id,qty])=> sum + itemPrice(id)*qty, 0); }
function cartCount(){ return Object.values(cart).reduce((a,b)=>a+b,0); }

function cartEtaNote(){
  if(cartCount()===0) return '';
  const pseudoOrder = { section: seat.section, items: Object.entries(cart).map(([id,qty])=>({id,qty})) };
  const est = estimateDelivery(pseudoOrder);
  return ` Est. delivery <b>~${est.minutes} min</b>.`;
}

function changeQty(id, delta){
  const cur = cart[id] || 0;
  const next = Math.max(0, cur+delta);
  if(next===0){ delete cart[id]; } else { cart[id] = next; }
  renderFan();
}

function renderSeatOptions(){
  return {
    section: SECTIONS.map(s=>`<option value="${s}" ${s==seat.section?'selected':''}>${s}</option>`).join(''),
    row: ROWS.map(r=>`<option value="${r}" ${r===seat.row?'selected':''}>${r}</option>`).join(''),
    seatn: SEATS.map(s=>`<option value="${s}" ${s==seat.seat?'selected':''}>${s}</option>`).join(''),
  };
}

function groupByStand(){
  const groups = {};
  MENU.forEach(item=>{ groups[item.stand] = groups[item.stand] || []; groups[item.stand].push(item); });
  return groups;
}

function renderFan(){
  const el = document.getElementById('view-fan');

  if(activeOrder){
    const stepIdx = STEPS.findIndex(s=>s.key===activeOrder.status);
    const itemsHtml = activeOrder.items.map(it=>`
      <div class="row"><span>${itemEmoji(it.id)} ${it.qty} x ${itemName(it.id)}</span><span class="mono">${money(itemPrice(it.id)*it.qty)}</span></div>
    `).join('') + `<div class="row"><span>Total</span><span class="mono">${money(activeOrder.items.reduce((s,it)=>s+itemPrice(it.id)*it.qty,0))}</span></div>`;

    const stepsHtml = STEPS.map((s,i)=>`
      <div class="step ${i<stepIdx?'done':''} ${i===stepIdx?'current':''}">
        <div class="line"></div>
        <div class="dot"><i class="ti ${i<=stepIdx?'ti-check':s.icon}"></i></div>
        <span class="label">${s.label}</span>
      </div>
    `).join('');

    const etaText = activeOrder.status==='delivered' ? 'Delivered to your seat, enjoy the game!'
      : activeOrder.status==='on_the_way' ? 'Your runner is on the concourse, headed your way.'
      : activeOrder.status==='preparing' ? 'The stand is firing up your order now.'
      : 'Your order just hit the kitchen queue.';

    const totalSteps = STEPS.length - 1;
    const remainingMin = activeOrder.status==='delivered' ? 0
      : Math.max(1, Math.round(activeOrder.etaMinutes * (1 - stepIdx/totalSteps)));

    el.innerHTML = `
      <div class="card">
        <div class="tracker-seat">
          <div>
            <div class="section-label">Order status</div>
            <h2>Sec ${activeOrder.section} - Row ${activeOrder.row} - Seat ${activeOrder.seat}</h2>
          </div>
          <span class="order-id mono">#SY-${activeOrder.id}</span>
        </div>
        <div class="stepper">${stepsHtml}</div>
        <div class="eta-banner">
          <i class="ti ${activeOrder.status==='delivered'?'ti-circle-check':'ti-clock'}"></i>
          <div><b>${activeOrder.status==='delivered' ? 'Delivered' : '~' + remainingMin + ' min'}</b> - ${etaText}</div>
        </div>
        <div class="order-list">${itemsHtml}</div>
        ${activeOrder.status==='delivered' ? '<button class="again-btn" onclick="orderAgain()">Order again</button>' : ''}
      </div>
    `;
    return;
  }

  const opts = renderSeatOptions();
  const groups = groupByStand();
  let menuHtml = '';
  Object.entries(groups).forEach(([stand, items])=>{
    menuHtml += `<div class="stand-group"><div class="stand-name"><i class="ti ti-tent" aria-hidden="true"></i> ${stand}</div>`;
    items.forEach(item=>{
      const qty = cart[item.id] || 0;
      menuHtml += `
        <div class="menu-item">
          <div class="item-thumb" aria-hidden="true">${item.emoji}</div>
          <div class="info"><h3>${item.name}</h3><p>${item.desc}</p></div>
          <div class="price mono">${money(item.price)}</div>
          <div class="qty">
            <button onclick="changeQty('${item.id}',-1)" ${qty===0?'disabled':''}>-</button>
            <span>${qty}</span>
            <button onclick="changeQty('${item.id}',1)">+</button>
          </div>
        </div>`;
    });
    menuHtml += `</div>`;
  });

  el.innerHTML = `
    <div class="card" style="margin-bottom:20px;">
      <div class="section-label">Your seat</div>
      <div class="seat-row">
        <div class="field"><label>Section</label><select onchange="seat.section=this.value">${opts.section}</select></div>
        <div class="field"><label>Row</label><select onchange="seat.row=this.value">${opts.row}</select></div>
        <div class="field"><label>Seat</label><select onchange="seat.seat=this.value">${opts.seatn}</select></div>
      </div>
      <div class="seat-preview"><i class="ti ti-armchair"></i> We'll deliver straight to Section ${seat.section}, Row ${seat.row}, Seat ${seat.seat}.${cartEtaNote()}</div>
      <div class="section-label">Order from any stand in the park</div>
      ${menuHtml}
    </div>
  `;

  const bar = document.getElementById('cartBar');
  const count = cartCount();
  document.getElementById('cartCount').textContent = count;
  document.getElementById('cartTotal').textContent = money(cartTotal());
  bar.classList.toggle('show', count>0);
}

function placeOrder(){
  if(cartCount()===0) return;
  const order = {
    id: orderCounter++,
    section: seat.section, row: seat.row, seat: seat.seat,
    items: Object.entries(cart).map(([id,qty])=>({id,qty})),
    status:'placed',
    placedAt: Date.now(),
  };
  const est = estimateDelivery(order);
  order.etaMinutes = est.minutes;
  order.etaDistance = est.distance;
  queue.push(order);
  activeOrder = order;
  cart = {};
  renderFan();
  renderRunner();
}

function orderAgain(){ activeOrder = null; renderFan(); }
function statusLabel(s){ return STEPS.find(x=>x.key===s).label; }
function elapsed(ms){
  const s = Math.floor((Date.now()-ms)/1000);
  if(s<60) return s+'s ago';
  return Math.floor(s/60)+'m ago';
}

function advanceOrder(id){
  const order = queue.find(o=>o.id===id);
  if(!order) return;
  const idx = STEPS.findIndex(s=>s.key===order.status);
  if(idx < STEPS.length-1){ order.status = STEPS[idx+1].key; }
  if(order.status==='delivered'){
    completed.push(order);
    queue = queue.filter(o=>o.id!==id);
  }
  if(activeOrder && activeOrder.id===id){ activeOrder = order; }
  renderRunner();
  renderFan();
}

function renderRunner(){
  const el = document.getElementById('view-runner');
  const activeCount = queue.length;
  const deliveredToday = completed.length;
  const avgTime = deliveredToday
    ? Math.round(completed.reduce((s,o)=>s+o.etaMinutes,0) / deliveredToday) + 'm'
    : '-';

  let cardsHtml = '';
  if(queue.length===0){
    cardsHtml = '<div class="empty-note">Queue is clear - no open orders right now.</div>';
  } else {
    queue.slice().sort((a,b)=>a.placedAt-b.placedAt).forEach(order=>{
      const itemsSummary = order.items.map(it=>`${itemEmoji(it.id)} ${it.qty}x ${itemName(it.id)}`).join(', ');
      const nextLabel = order.status==='placed' ? 'Start preparing' : order.status==='preparing' ? 'Send to seat' : 'Mark delivered';
      cardsHtml += `
        <div class="order-card ${order.status}">
          <div class="seat-block"><i class="ti ti-armchair" aria-hidden="true"></i> Sec ${order.section} - ${order.row}${order.seat}</div>
          <div class="items-block">${itemsSummary}</div>
          <div class="meta">${elapsed(order.placedAt)}<br>~${order.etaMinutes}m &middot; ${order.etaDistance} sections</div>
          <span class="status-badge ${order.status}">${statusLabel(order.status)}</span>
          <button class="advance-btn" onclick="advanceOrder(${order.id})">${nextLabel}</button>
        </div>
      `;
    });
  }

  el.innerHTML = `
    <div class="runner-stats">
      <div class="stat-chip"><div class="n mono">${activeCount}</div><div class="l">Open orders</div></div>
      <div class="stat-chip"><div class="n mono">${deliveredToday}</div><div class="l">Delivered today</div></div>
      <div class="stat-chip"><div class="n mono">${avgTime}</div><div class="l">Avg. delivery time</div></div>
    </div>
    <div class="queue-title">Concourse queue - Chukchansi Park</div>
    ${cardsHtml}
  `;
}

function setTab(which){
  document.getElementById('view-fan').classList.toggle('active', which==='fan');
  document.getElementById('view-runner').classList.toggle('active', which==='runner');
  document.getElementById('tabFan').classList.toggle('active', which==='fan');
  document.getElementById('tabRunner').classList.toggle('active', which==='runner');
  document.getElementById('cartBar').classList.toggle('show', which==='fan' && cartCount()>0);
}

renderFan();
renderRunner();
setInterval(()=>{ renderRunner(); if(activeOrder) renderFan(); }, 1000);
</script>
