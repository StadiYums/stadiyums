<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StadiYums Demo — Chukchansi Park</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsqr/1.4.0/jsQR.js"></script>
<style>
  :root{
    --navy:#0B1D33;
    --navy-2:#132A47;
    --navy-soft:#1E3A5F;
    --orange:#FD490A;
    --orange-2:#FF7440;
    --green:#307C27;
    --green-2:#3F9A33;
    --cream:#F7F5F0;
    --line:#E4E0D8;
    --ink:#0B1D33;
    --muted:#6B7280;
    --radius:16px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--cream);color:var(--ink);}
  body{min-height:100vh;}
  h1,h2,h3,h4{font-family:"Arial Black","Helvetica Neue",Arial,sans-serif;letter-spacing:-0.02em;margin:0;}
  .app{max-width:520px;margin:0 auto;min-height:100vh;background:#fff;box-shadow:0 0 60px rgba(11,29,51,0.08);position:relative;display:flex;flex-direction:column;}

  /* ---- Top bar ---- */
  .topbar{background:var(--navy);color:#fff;padding:14px 18px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:40;}
  .topbar img{width:38px;height:38px;border-radius:50%;display:block;flex-shrink:0;}
  .topbar .brandtext{flex:1;min-width:0;}
  .topbar .brandtext .name{font-size:19px;font-weight:900;letter-spacing:-0.01em;line-height:1;}
  .topbar .brandtext .name .yums{color:var(--orange);}
  .topbar .brandtext .sub{font-size:10.5px;color:#9FB0C6;margin-top:3px;text-transform:uppercase;letter-spacing:0.09em;font-weight:600;}

  /* ---- View switcher ---- */
  .switcher{display:flex;background:var(--navy-2);padding:0 10px;gap:6px;}
  .switcher button{flex:1;background:transparent;border:none;color:#8CA0BA;padding:11px 6px 12px;font-size:12.5px;font-weight:800;letter-spacing:0.04em;text-transform:uppercase;cursor:pointer;border-bottom:3px solid transparent;transition:all .15s;}
  .switcher button.active{color:#fff;border-bottom-color:var(--orange);}

  .view{display:none;flex:1;flex-direction:column;}
  .view.active{display:flex;}

  /* ---- Fan: seat bar ---- */
  .seatbar{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-soft) 100%);color:#fff;padding:16px 18px 20px;}
  .seatbar .label{font-size:10.5px;text-transform:uppercase;letter-spacing:0.1em;color:#9FB0C6;font-weight:700;margin-bottom:8px;}
  .seatfields{display:flex;gap:8px;}
  .seatfields select{flex:1;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.18);color:#fff;padding:9px 8px;border-radius:10px;font-size:14px;font-weight:700;text-align:center;}
  .seatfields select option{color:#111;}

  /* ---- Menu ---- */
  .menuwrap{padding:16px 16px 100px;flex:1;overflow-y:auto;}
  .menusection-title{font-size:13px;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);font-weight:800;margin:18px 2px 10px;}
  .menusection-title:first-child{margin-top:2px;}
  .card{border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;margin-bottom:10px;display:flex;gap:12px;align-items:center;background:#fff;}
  .card .emoji{width:50px;height:50px;border-radius:12px;background:var(--cream);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;}
  .card .info{flex:1;min-width:0;}
  .card .info .nm{font-weight:800;font-size:15px;}
  .card .info .desc{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.3;}
  .card .info .pr{font-weight:800;color:var(--navy);font-size:13.5px;margin-top:5px;}
  .addbtn{background:var(--navy);color:#fff;border:none;width:36px;height:36px;border-radius:50%;font-size:20px;font-weight:700;cursor:pointer;flex-shrink:0;line-height:1;display:flex;align-items:center;justify-content:center;transition:transform .1s;}
  .addbtn:active{transform:scale(0.9);}

  /* ---- Cart bar ---- */
  .cartbar{position:absolute;left:0;right:0;bottom:0;background:var(--orange);color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;font-weight:800;cursor:pointer;box-shadow:0 -8px 24px rgba(253,73,10,0.25);}
  .cartbar .ct{font-size:13.5px;}
  .cartbar .amt{font-size:16px;}
  .cartbar.hidden{display:none;}

  /* ---- Modal ---- */
  .overlay{position:absolute;inset:0;background:rgba(11,29,51,0.55);z-index:60;display:none;align-items:flex-end;}
  .overlay.show{display:flex;}
  .sheet{background:#fff;width:100%;border-radius:22px 22px 0 0;padding:20px 20px 22px;max-height:88%;overflow-y:auto;animation:up .22s ease-out;}
  @keyframes up{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .sheet .grabber{width:38px;height:4px;background:var(--line);border-radius:3px;margin:0 auto 14px;}
  .sheet h3{font-size:19px;margin-bottom:2px;}
  .sheet .sheet-sub{font-size:12.5px;color:var(--muted);margin-bottom:14px;}
  .choicegroup{margin-bottom:16px;}
  .choicegroup .cg-title{font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:0.06em;color:var(--navy);margin-bottom:8px;}
  .chip-grid{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{border:1.5px solid var(--line);border-radius:20px;padding:8px 14px;font-size:13.5px;font-weight:700;cursor:pointer;background:#fff;color:var(--ink);user-select:none;transition:all .12s;}
  .chip.sel{background:var(--navy);border-color:var(--navy);color:#fff;}
  .chip.sel.orange{background:var(--orange);border-color:var(--orange);}
  .qtyrow{display:flex;align-items:center;justify-content:center;gap:18px;margin:6px 0 18px;}
  .qtyrow button{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-size:19px;font-weight:800;cursor:pointer;}
  .qtyrow .qn{font-size:19px;font-weight:900;min-width:24px;text-align:center;}
  .sheetbtn{width:100%;background:var(--orange);color:#fff;border:none;padding:15px;border-radius:12px;font-size:15px;font-weight:800;cursor:pointer;}
  .sheetbtn.secondary{background:var(--navy);}

  /* ---- Cart sheet ---- */
  .cartline{display:flex;justify-content:space-between;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);gap:10px;}
  .cartline .cl-name{font-weight:800;font-size:14px;}
  .cartline .cl-opts{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .cartline .cl-price{font-weight:800;font-size:13.5px;white-space:nowrap;}
  .cartline .cl-remove{background:none;border:none;color:#C0392B;font-size:11px;font-weight:700;cursor:pointer;padding:4px 0 0;}
  .totalsblock{margin-top:14px;padding-top:6px;}
  .trow{display:flex;justify-content:space-between;font-size:13.5px;color:var(--muted);padding:4px 0;}
  .trow.grand{color:var(--ink);font-weight:900;font-size:17px;border-top:1px solid var(--line);margin-top:6px;padding-top:10px;}
  .feenote{font-size:10.5px;color:var(--muted);margin-top:-2px;margin-bottom:2px;}

  /* ---- Status / tracker ---- */
  .tracker{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:30px 24px;text-align:center;}
  .tracker .seatchip{background:var(--cream);border:1px solid var(--line);border-radius:20px;padding:6px 14px;font-size:12.5px;font-weight:800;color:var(--navy);margin-bottom:22px;}
  .steps{display:flex;align-items:center;width:100%;max-width:340px;margin-bottom:26px;}
  .step{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;}
  .step .dot{width:34px;height:34px;border-radius:50%;background:var(--line);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;z-index:2;transition:all .3s;}
  .step .lbl{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:0.03em;color:var(--muted);margin-top:7px;}
  .step.done .dot{background:var(--green);}
  .step.active .dot{background:var(--orange);box-shadow:0 0 0 6px rgba(253,73,10,0.15);}
  .step.done .lbl,.step.active .lbl{color:var(--ink);}
  .connector{flex:1;height:3px;background:var(--line);margin-bottom:26px;position:relative;top:-2px;}
  .connector.done{background:var(--green);}

  .qrcard{background:#fff;border:2px dashed var(--navy);border-radius:18px;padding:22px 22px 18px;margin-top:6px;position:relative;}
  .qrcard .qrlabel{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);margin-bottom:12px;}
  #qrcode-canvas{display:flex;justify-content:center;}
  .qrcard .ordertoken{margin-top:12px;font-family:"Courier New",monospace;font-weight:800;font-size:15px;letter-spacing:0.12em;color:var(--navy);}
  .qrcard .qrhint{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.4;}

  .bigstatus{font-size:20px;font-weight:900;margin-bottom:4px;}
  .bigstatus-sub{font-size:13px;color:var(--muted);margin-bottom:20px;}

  .newordbtn{margin-top:22px;background:none;border:1.5px solid var(--line);color:var(--muted);padding:10px 18px;border-radius:10px;font-size:12.5px;font-weight:700;cursor:pointer;}

  .successwrap{display:flex;flex-direction:column;align-items:center;}
  .checkburst{width:78px;height:78px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;margin-bottom:16px;animation:pop .4s cubic-bezier(.34,1.56,.64,1);}
  @keyframes pop{0%{transform:scale(0);}70%{transform:scale(1.1);}100%{transform:scale(1);}}
  .checkburst svg{width:38px;height:38px;}

  /* ---- Runner view ---- */
  .runnerhead{background:var(--navy);color:#fff;padding:14px 18px 16px;}
  .runnerhead .rh-title{font-size:16px;font-weight:900;}
  .runnerhead .rh-sub{font-size:11.5px;color:#9FB0C6;margin-top:2px;}
  .queuewrap{padding:14px 16px 40px;flex:1;overflow-y:auto;}
  .qsection-title{font-size:12px;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);font-weight:800;margin:16px 2px 8px;}
  .qsection-title:first-child{margin-top:0;}
  .ordercard{border:1px solid var(--line);border-radius:14px;padding:14px 15px;margin-bottom:10px;background:#fff;}
  .ordercard .oc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
  .ordercard .oc-seat{font-weight:900;font-size:15px;color:var(--navy);}
  .ordercard .oc-id{font-size:10.5px;color:var(--muted);font-family:"Courier New",monospace;margin-top:2px;}
  .badge{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:0.04em;padding:4px 9px;border-radius:20px;white-space:nowrap;}
  .badge.new{background:#FFF1E8;color:var(--orange);}
  .badge.prep{background:#FFF6DC;color:#9A7B00;}
  .badge.otw{background:#E9F1FF;color:#2A5DB0;}
  .badge.ready{background:#E9F7E6;color:var(--green);}
  .ordercard .oc-items{font-size:12.5px;color:var(--ink);line-height:1.5;margin-bottom:10px;}
  .ordercard .oc-items .oi-opt{color:var(--muted);}
  .ordercard .oc-actionrow{display:flex;gap:8px;}
  .ocbtn{flex:1;border:none;padding:10px;border-radius:10px;font-size:12.5px;font-weight:800;cursor:pointer;}
  .ocbtn.prepbtn{background:var(--navy);color:#fff;}
  .ocbtn.otwbtn{background:var(--orange);color:#fff;}
  .ocbtn.scanbtn{background:var(--green);color:#fff;}
  .emptyqueue{text-align:center;color:var(--muted);font-size:13px;padding:40px 20px;}

  /* ---- Scanner modal ---- */
  .scanoverlay{position:absolute;inset:0;background:rgba(0,0,0,0.92);z-index:80;display:none;flex-direction:column;color:#fff;}
  .scanoverlay.show{display:flex;}
  .scanhead{padding:16px 18px;display:flex;justify-content:space-between;align-items:center;}
  .scanhead .st{font-weight:800;font-size:14px;}
  .scanclose{background:rgba(255,255,255,0.12);border:none;color:#fff;width:30px;height:30px;border-radius:50%;font-size:16px;cursor:pointer;}
  .scanbody{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;}
  .viewfinder{width:230px;height:230px;border:3px solid rgba(255,255,255,0.85);border-radius:20px;position:relative;overflow:hidden;background:#111;margin-bottom:18px;}
  .viewfinder video{width:100%;height:100%;object-fit:cover;}
  .viewfinder .scanline{position:absolute;left:8%;right:8%;height:2px;background:var(--orange);box-shadow:0 0 8px var(--orange);animation:scan 1.6s ease-in-out infinite;}
  @keyframes scan{0%{top:8%;}50%{top:88%;}100%{top:8%;}}
  .scanmsg{font-size:12.5px;color:#C9D3DE;margin-bottom:18px;line-height:1.5;max-width:260px;}
  .simbtn{background:var(--green);color:#fff;border:none;padding:13px 22px;border-radius:12px;font-weight:800;font-size:13.5px;cursor:pointer;margin-bottom:10px;width:100%;max-width:260px;}
  .camerabtn{background:rgba(255,255,255,0.12);color:#fff;border:1px solid rgba(255,255,255,0.3);padding:11px 22px;border-radius:12px;font-weight:700;font-size:12.5px;cursor:pointer;width:100%;max-width:260px;}

  ::-webkit-scrollbar{width:0px;}
</style>
</head>

    <button class="camerabtn" id="cameraBtn" onclick="startCamera()">Enable camera</button>
    <div style="height:10px;"></div>
    <button class="simbtn" onclick="simulateScan()">Simulate scan (demo)</button>
  </div>
</div>

<script>
/* ================= MENU DATA ================= */
const MENU = [
  {id:'hotdog', section:'Ballpark Classics', name:'Ballpark Hot Dog', desc:'All-beef dog, toasted bun', price:6.50, emoji:'🌭', choice:'condiments', options:['Ketchup','Mustard','Relish','Onions','Sauerkraut'], maxSel:3},
  {id:'nachos', section:'Ballpark Classics', name:'Loaded Nachos', desc:'Warm chips, queso, jalapeños on request', price:9.00, emoji:'🧀', choice:'condiments', options:['Jalapeños','Sour Cream','Extra Cheese','Pico de Gallo'], maxSel:3},
  {id:'pretzel', section:'Ballpark Classics', name:'Soft Pretzel', desc:'Warm, salted, served with dip', price:6.00, emoji:'🥨', choice:'condiments', options:['Cheese Sauce','Mustard','No Dip'], maxSel:1},
  {id:'tenders', section:'Ballpark Classics', name:'Chicken Tenders', desc:'Crispy tenders, choice of sauce', price:10.50, emoji:'🍗', choice:'condiments', options:['BBQ','Ranch','Honey Mustard','No Sauce'], maxSel:1},
  {id:'fries', section:'Sides & Snacks', name:'Garlic Fries', desc:'Fresh-cut, garlic + parmesan', price:7.00, emoji:'🍟'},
  {id:'popcorn', section:'Sides & Snacks', name:'Kettle Corn', desc:'Sweet & salty, fresh popped', price:6.50, emoji:'🍿'},
  {id:'churro', section:'Sides & Snacks', name:'Churros', desc:'Cinnamon sugar, two pieces', price:6.00, emoji:'🥐'},
  {id:'fountain', section:'Drinks', name:'Fountain Drink', desc:'Pick your flavor & size', price:5.50, emoji:'🥤', choice:'fountain', options:['Coca-Cola','Diet Coke','Sprite','Fanta Orange'], sizes:[{n:'Regular',add:0},{n:'Large',add:1.25}]},
  {id:'water', section:'Drinks', name:'Bottled Water', desc:'16.9 oz', price:4.00, emoji:'💧'},
  {id:'beer', section:'Drinks', name:'Local Craft Beer', desc:'16 oz draft · ID required on delivery', price:11.00, emoji:'🍺'},
];
const SERVICE_FEE_RATE = 0.06;

/* ================= STATE ================= */
let cart = [];              // items currently being built by the fan
let currentOrder = null;    // the fan's active placed order
let orders = [];            // shared order queue (runner sees this)
let orderCounter = 1000;
let activeItemDraft = null;

/* ================= INIT ================= */
function initSeatSelectors(){
  const rowSel = document.getElementById('seatRow');
  const seatSel = document.getElementById('seatSeat');
  for(let r=1;r<=20;r++){ rowSel.innerHTML += `<option>Row ${r}</option>`; }
  for(let s=1;s<=30;s++){ seatSel.innerHTML += `<option>Seat ${s}</option>`; }
  rowSel.selectedIndex = 6; seatSel.selectedIndex = 10;
}

function renderMenu(){
  const wrap = document.getElementById('menuwrap');
  let html = '';
  let lastSection = '';
  MENU.forEach(item=>{
    if(item.section !== lastSection){
      html += `<div class="menusection-title">${item.section}</div>`;
      lastSection = item.section;
    }
    html += `<div class="card">
      <div class="emoji">${item.emoji}</div>
      <div class="info">
        <div class="nm">${item.name}</div>
        <div class="desc">${item.desc}</div>
        <div class="pr">$${item.price.toFixed(2)}</div>
      </div>
      <button class="addbtn" onclick="openItem('${item.id}')">+</button>
    </div>`;
  });
  wrap.innerHTML = html;
}

/* ================= ITEM SHEET ================= */
function openItem(itemId){
  const item = MENU.find(m=>m.id===itemId);
  activeItemDraft = {item, qty:1, selectedOpts:[], size: item.sizes ? item.sizes[0] : null};
  renderItemSheet();
  document.getElementById('itemOverlay').classList.add('show');
}
function closeItemSheet(){ document.getElementById('itemOverlay').classList.remove('show'); }

function renderItemSheet(){
  const {item, qty, selectedOpts, size} = activeItemDraft;
  let choiceHtml = '';
  if(item.choice === 'condiments'){
    choiceHtml = `<div class="choicegroup">
      <div class="cg-title">${item.maxSel===1 ? 'Choose one' : `Add condiments (up to ${item.maxSel})`}</div>
      <div class="chip-grid">
        ${item.options.map(o=>`<div class="chip ${selectedOpts.includes(o)?'sel':''}" onclick="toggleOpt('${o}', ${item.maxSel})">${o}</div>`).join('')}
      </div>
    </div>`;
  } else if(item.choice === 'fountain'){
    choiceHtml = `<div class="choicegroup">
      <div class="cg-title">Choose flavor</div>
      <div class="chip-grid">
        ${item.options.map(o=>`<div class="chip ${selectedOpts[0]===o?'sel orange':''}" onclick="toggleOpt('${o}', 1)">${o}</div>`).join('')}
      </div>
    </div>
    <div class="choicegroup">
      <div class="cg-title">Size</div>
      <div class="chip-grid">
        ${item.sizes.map(sz=>`<div class="chip ${size && size.n===sz.n?'sel orange':''}" onclick='setSize(${JSON.stringify(sz)})'>${sz.n}${sz.add>0? ' +$'+sz.add.toFixed(2):''}</div>`).join('')}
      </div>
    </div>`;
  }

  const unitPrice = item.price + (size ? size.add : 0);
  document.getElementById('itemSheet').innerHTML = `
    <div class="grabber"></div>
    <h3>${item.emoji} ${item.name}</h3>
    <div class="sheet-sub">${item.desc}</div>
    ${choiceHtml}
    <div class="choicegroup">
      <div class="cg-title">Quantity</div>
      <div class="qtyrow">
        <button onclick="changeQty(-1)">–</button>
        <div class="qn">${qty}</div>
        <button onclick="changeQty(1)">+</button>
      </div>
    </div>
    <button class="sheetbtn" onclick="addDraftToCart()">Add to order · $${(unitPrice*qty).toFixed(2)}</button>
  `;
}
function toggleOpt(opt, maxSel){
  const d = activeItemDraft;
  if(maxSel === 1){
    d.selectedOpts = d.selectedOpts[0]===opt ? [] : [opt];
  } else {
    const idx = d.selectedOpts.indexOf(opt);
    if(idx>-1){ d.selectedOpts.splice(idx,1); }
    else if(d.selectedOpts.length < maxSel){ d.selectedOpts.push(opt); }
  }
  renderItemSheet();
}
function setSize(sz){ activeItemDraft.size = sz; renderItemSheet(); }
function changeQty(delta){
  activeItemDraft.qty = Math.max(1, activeItemDraft.qty + delta);
  renderItemSheet();
}
function addDraftToCart(){
  const {item, qty, selectedOpts, size} = activeItemDraft;
  const unitPrice = item.price + (size ? size.add : 0);
  cart.push({
    itemId:item.id, name:item.name, emoji:item.emoji, qty,
    opts: item.choice==='fountain' ? [ (selectedOpts[0]||'No preference'), size ? size.n : '' ].filter(Boolean) : selectedOpts,
    unitPrice, lineTotal: unitPrice*qty
  });
  closeItemSheet();
  updateCartBar();
}

/* ================= CART ================= */
function updateCartBar(){
  const bar = document.getElementById('cartbar');
  const count = cart.reduce((s,c)=>s+c.qty,0);
  const subtotal = cart.reduce((s,c)=>s+c.lineTotal,0);
  const total = subtotal * (1+SERVICE_FEE_RATE);
  document.getElementById('cartCount').textContent = count;
  document.getElementById('cartAmt').textContent = total.toFixed(2);
  bar.classList.toggle('hidden', count===0);
}
function openCart(){ renderCartSheet(); document.getElementById('cartOverlay').classList.add('show'); }
function closeCart(){ document.getElementById('cartOverlay').classList.remove('show'); }
function removeLine(idx){ cart.splice(idx,1); renderCartSheet(); updateCartBar(); }

function renderCartSheet(){
  const subtotal = cart.reduce((s,c)=>s+c.lineTotal,0);
  const fee = subtotal * SERVICE_FEE_RATE;
  const total = subtotal + fee;
  const lines = cart.map((c,idx)=>`
    <div class="cartline">
      <div>
        <div class="cl-name">${c.qty}× ${c.emoji} ${c.name}</div>
        ${c.opts && c.opts.length ? `<div class="cl-opts">${c.opts.join(', ')}</div>` : ''}
        <button class="cl-remove" onclick="removeLine(${idx})">Remove</button>
      </div>
      <div class="cl-price">$${c.lineTotal.toFixed(2)}</div>
    </div>`).join('');

  document.getElementById('cartSheet').innerHTML = `
    <div class="grabber"></div>
    <h3>Your order</h3>
    <div class="sheet-sub">${document.getElementById('seatSection').value} · ${document.getElementById('seatRow').value} · ${document.getElementById('seatSeat').value}</div>
    ${cart.length ? lines : '<div class="sheet-sub" style="margin-top:14px;">Your cart is empty.</div>'}
    <div class="totalsblock">
      <div class="trow"><span>Subtotal</span><span>$${subtotal.toFixed(2)}</span></div>
      <div class="trow"><span>Service fee (6%)</span><span>$${fee.toFixed(2)}</span></div>
      <div class="trow grand"><span>Total</span><span>$${total.toFixed(2)}</span></div>
    </div>
    <div style="height:14px;"></div>
    <button class="sheetbtn" ${cart.length===0?'disabled style="opacity:.4;"':''} onclick="placeOrder()">Place order · $${total.toFixed(2)}</button>
  `;
}

/* ================= PLACE ORDER / TRACKER ================= */
function placeOrder(){
  const subtotal = cart.reduce((s,c)=>s+c.lineTotal,0);
  const fee = subtotal*SERVICE_FEE_RATE;
  const total = subtotal+fee;
  orderCounter++;
  const token = 'SY-'+orderCounter+'-'+Math.random().toString(36).substring(2,6).toUpperCase();
  const order = {
    id: orderCounter,
    token,
    seat: `${document.getElementById('seatSection').value} · ${document.getElementById('seatRow').value} · ${document.getElementById('seatSeat').value}`,
    items: cart.slice(),
    subtotal, fee, total,
    status: 'new', // new -> preparing -> on_the_way -> delivered
  };
  orders.unshift(order);
  currentOrder = order;
  cart = [];
  updateCartBar();
  closeCart();
  document.getElementById('fan-menu-screen').style.display='none';
  document.getElementById('fan-tracker-screen').style.display='flex';
  document.getElementById('fan-tracker-screen').className='tracker';
  renderTracker();
  renderQueue();
}

function statusIndex(status){ return {new:0, preparing:1, on_the_way:2, delivered:3}[status]; }

function renderTracker(){
  if(!currentOrder) return;
  const o = currentOrder;
  const idx = statusIndex(o.status);
  const stepDef = [
    {key:'new', label:'Order Placed', icon:'✓'},
    {key:'preparing', label:'Preparing', icon:'👨‍🍳'},
    {key:'on_the_way', label:'On The Way', icon:'🏃'},
    {key:'delivered', label:'Delivered', icon:'✓'},
  ];
  let stepsHtml = '';
  stepDef.forEach((s,i)=>{
    const cls = i < idx ? 'done' : (i===idx ? 'active' : '');
    stepsHtml += `<div class="step ${cls}"><div class="dot">${i<=idx? (i===idx&&idx<3? (i+1): '✓') : (i+1)}</div><div class="lbl">${s.label}</div></div>`;
    if(i<stepDef.length-1){ stepsHtml += `<div class="connector ${i<idx?'done':''}"></div>`; }
  });

  let bodyHtml = '';
  if(o.status !== 'on_the_way' && o.status !== 'delivered'){
    const msg = o.status==='new' ? ["Order placed!","Your runner will start preparing shortly."] : ["Preparing your order","Fresh from the stand — almost ready."];
    bodyHtml = `<div class="bigstatus">${msg[0]}</div><div class="bigstatus-sub">${msg[1]}</div>`;
  } else if(o.status === 'on_the_way'){
    bodyHtml = `
      <div class="bigstatus">Your runner is on the way!</div>
      <div class="bigstatus-sub">Show this QR code when they arrive at ${o.seat.split(' · ')[2]}.</div>
      <div class="qrcard">
        <div class="qrlabel">Delivery Handoff Code</div>
        <div id="qrcode-canvas"></div>
        <div class="ordertoken">${o.token}</div>
        <div class="qrhint">Your runner scans this to confirm your order was delivered.</div>
      </div>`;
  } else if(o.status === 'delivered'){
    bodyHtml = `
      <div class="successwrap">
        <div class="checkburst"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5L9.5 18L20 6" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <div class="bigstatus">Delivered — enjoy!</div>
        <div class="bigstatus-sub">Order ${o.token} confirmed at ${o.seat}.</div>
      </div>`;
  }

  document.getElementById('fan-tracker-screen').innerHTML = `
    <div class="seatchip">${o.seat}</div>
    <div class="steps">${stepsHtml}</div>
    ${bodyHtml}
    <button class="newordbtn" onclick="startNewOrder()">Start a new order</button>
  `;

  if(o.status === 'on_the_way'){
    setTimeout(()=>{
      const target = document.getElementById('qrcode-canvas');
      if(target && window.QRCode){
        target.innerHTML='';
        new QRCode(target, {text:o.token, width:168, height:168, colorDark:'#0B1D33', colorLight:'#ffffff'});
      }
    }, 10);
  }
}

function startNewOrder(){
  currentOrder = null;
  document.getElementById('fan-tracker-screen').style.display='none';
  document.getElementById('fan-menu-screen').style.display='block';
}

/* ================= RUNNER QUEUE ================= */
function renderQueue(){
  const wrap = document.getElementById('queuewrap');
  const active = orders.filter(o=>o.status!=='delivered');
  const done = orders.filter(o=>o.status==='delivered');

  function itemsSummary(o){
    return o.items.map(it=>`${it.qty}× ${it.name}${it.opts && it.opts.length? ` <span class="oi-opt">(${it.opts.join(', ')})</span>`:''}`).join('<br>');
  }
  function badge(status){
    const map = {new:['New','new'], preparing:['Preparing','prep'], on_the_way:['On The Way','otw'], delivered:['Delivered','ready']};
    const [label,cls] = map[status];
    return `<span class="badge ${cls}">${label}</span>`;
  }
  function actions(o){
    if(o.status==='new') return `<div class="oc-actionrow"><button class="ocbtn prepbtn" onclick="advanceOrder(${o.id},'preparing')">Start preparing</button></div>`;
    if(o.status==='preparing') return `<div class="oc-actionrow"><button class="ocbtn otwbtn" onclick="advanceOrder(${o.id},'on_the_way')">Head to seat</button></div>`;
    if(o.status==='on_the_way') return `<div class="oc-actionrow"><button class="ocbtn scanbtn" onclick="openScanner(${o.id})">Scan QR to complete</button></div>`;
    return '';
  }

  let html = '';
  if(active.length){
    html += `<div class="qsection-title">Active (${active.length})</div>`;
    active.forEach(o=>{
      html += `<div class="ordercard">
        <div class="oc-top">
          <div>
            <div class="oc-seat">${o.seat}</div>
            <div class="oc-id">${o.token} · $${o.total.toFixed(2)}</div>
          </div>
          ${badge(o.status)}
        </div>
        <div class="oc-items">${itemsSummary(o)}</div>
        ${actions(o)}
      </div>`;
    });
  }
  if(done.length){
    html += `<div class="qsection-title">Completed (${done.length})</div>`;
    done.forEach(o=>{
      html += `<div class="ordercard" style="opacity:.6;">
        <div class="oc-top">
          <div>
            <div class="oc-seat">${o.seat}</div>
            <div class="oc-id">${o.token} · $${o.total.toFixed(2)}</div>
          </div>
          ${badge(o.status)}
        </div>
        <div class="oc-items">${itemsSummary(o)}</div>
      </div>`;
    });
  }
  if(!active.length && !done.length){
    html = `<div class="emptyqueue">No orders yet. Place an order from the Fan App to see it here.</div>`;
  }
  wrap.innerHTML = html;
}

function advanceOrder(orderId, newStatus){
  const o = orders.find(x=>x.id===orderId);
  if(!o) return;
  o.status = newStatus;
  renderQueue();
  if(currentOrder && currentOrder.id===orderId){ renderTracker(); }
}

/* ================= SCANNER ================= */
let scanningOrderId = null;
let cameraStream = null;
let scanRAF = null;

function openScanner(orderId){
  scanningOrderId = orderId;
  document.getElementById('scanOverlay').classList.add('show');
  document.getElementById('scanmsg').textContent = "Point the camera at the fan's order QR code, or simulate the scan for this demo.";
}
function closeScanner(){
  document.getElementById('scanOverlay').classList.remove('show');
  stopCamera();
}
function stopCamera(){
  if(scanRAF){ cancelAnimationFrame(scanRAF); scanRAF=null; }
  if(cameraStream){ cameraStream.getTracks().forEach(t=>t.stop()); cameraStream=null; }
  const vf = document.getElementById('viewfinder');
  vf.querySelectorAll('video, canvas').forEach(el=>el.remove());
  const line = document.createElement('div');
  line.className='scanline';
  if(!vf.querySelector('.scanline')) vf.appendChild(line);
}
async function startCamera(){
  try{
    cameraStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    const vf = document.getElementById('viewfinder');
    const video = document.createElement('video');
    video.setAttribute('playsinline','');
    video.srcObject = cameraStream;
    vf.insertBefore(video, vf.firstChild);
    video.play();
    document.getElementById('cameraBtn').style.display='none';
    document.getElementById('scanmsg').textContent = 'Scanning… hold steady over the QR code.';

    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    function tick(){
      if(video.readyState === video.HAVE_ENOUGH_DATA){
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        ctx.drawImage(video,0,0,canvas.width,canvas.height);
        const imgData = ctx.getImageData(0,0,canvas.width,canvas.height);
        if(window.jsQR){
          const code = jsQR(imgData.data, imgData.width, imgData.height);
          if(code && code.data){
            handleScanResult(code.data);
            return;
          }
        }
      }
      scanRAF = requestAnimationFrame(tick);
    }
    scanRAF = requestAnimationFrame(tick);
  }catch(err){
    document.getElementById('scanmsg').textContent = "Camera unavailable in this browser/demo — use Simulate scan below instead.";
  }
}
function handleScanResult(data){
  const o = orders.find(x=>x.id===scanningOrderId);
  if(o && data === o.token){
    completeScan();
  } else {
    document.getElementById('scanmsg').textContent = "That code doesn't match this order — try again.";
  }
}
function simulateScan(){ completeScan(); }
function completeScan(){
  const o = orders.find(x=>x.id===scanningOrderId);
  if(o){ o.status='delivered'; }
  stopCamera();
  document.getElementById('scanOverlay').classList.remove('show');
  renderQueue();
  if(currentOrder && currentOrder.id===scanningOrderId){ renderTracker(); }
  scanningOrderId = null;
}

/* ================= VIEW SWITCH ================= */
function switchView(v){
  document.getElementById('tabFan').classList.toggle('active', v==='fan');
  document.getElementById('tabRunner').classList.toggle('active', v==='runner');
  document.getElementById('view-fan').classList.toggle('active', v==='fan');
  document.getElementById('view-runner').classList.toggle('active', v==='runner');
  if(v==='runner') renderQueue();
}

/* overlay backdrop click to close */
document.getElementById('itemOverlay').addEventListener('click', e=>{ if(e.target.id==='itemOverlay') closeItemSheet(); });
document.getElementById('cartOverlay').addEventListener('click', e=>{ if(e.target.id==='cartOverlay') closeCart(); });

/* ================= BOOT ================= */
initSeatSelectors();
renderMenu();
updateCartBar();
renderQueue();
</script>
</body>
</html>
